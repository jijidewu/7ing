name: 微信每晚晚安推送

on:
  # 由外部精准定时器（如 Cron-Job.org 每天 21:57）直接调用 API 触发
  # 移除 GitHub 内置 schedule，彻底杜绝 GitHub 高峰期长达数小时的严重延迟和误报
  workflow_dispatch:

jobs:
  night_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行晚安推送
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          NIGHT_TEMPLATE_ID: ${{ secrets.NIGHT_TEMPLATE_ID }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          CITY: ${{ secrets.CITY }}
          START_DATE: ${{ secrets.START_DATE }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
          BIRTHDAY_TYPE: ${{ secrets.BIRTHDAY_TYPE }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          python main.py --mode night
