name: 微信每日早安推送

on:
  # 每天北京时间早上 07:30 自动触发 (UTC 23:30)
  schedule:
    - cron: '30 23 * * *'
  # 支持在 GitHub 页面上手动点击测试
  workflow_dispatch:

jobs:
  morning_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行推送程序
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          USER_OPENID: ${{ secrets.USER_OPENID }}
          CITY: ${{ secrets.CITY }}
          START_DATE: ${{ secrets.START_DATE }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
          BIRTHDAY_TYPE: ${{ secrets.BIRTHDAY_TYPE }}
          CUSTOM_NOTE: ${{ secrets.CUSTOM_NOTE }}
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          python main.py --mode morning
